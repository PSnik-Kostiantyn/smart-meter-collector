# Для навчального стенду дозволено анонімне підключення.
# Для реального розгортання слід увімкнути password_file і TLS на порту 8883.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# Черга на клієнта. Якщо колектор відстає довше, ніж вміщує черга,
# брокер почне скидати повідомлення. Детальніше в розділі 3 записки.
max_queued_messages 1000000
max_inflight_messages 1000
log_dest stdout
log_type error
log_type warning
log_type notice
